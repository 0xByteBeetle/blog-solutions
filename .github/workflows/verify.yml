name: Verify source integrity and examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  restored-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - run: node scripts/setup-restored.mjs
      - run: node scripts/check-catalog.mjs
      - run: node scripts/check-topology.mjs
      - run: node --test scripts/topology.test.mjs
      - run: python3 -m unittest discover -s hyperliquid/unpacking-hyperliquid-part-4-hip/projects/hip3-original/tests -v
      - run: node --test scripts/source-integrity.test.mjs
      - run: node scripts/check-evm-alignment.mjs
      - run: node scripts/check-solana-alignment.mjs
      - run: node scripts/check-live-source-freshness.mjs
      - run: node --test scripts/live-source-freshness.test.mjs
      - run: node scripts/check-hyperliquid-alignment.mjs
      - run: node --test scripts/hyperliquid-alignment.test.mjs
      - run: node --test scripts/solana-alignment.test.mjs
      - run: node --test scripts/evm-alignment.test.mjs scripts/toolchain.test.mjs
      - run: node scripts/verify-restored-builds.mjs
      - run: node scripts/verify-additional-companions.mjs
      - run: cargo test --locked --manifest-path solana/solana-deep-dive-unpacking-borsh/projects/borsh-proposal/Cargo.toml -p borsh_deep_dive --test allocation
      - run: node scripts/verify-restored-evm.mjs
      - run: go test -count=1 ./...
        working-directory: evm/proxies-and-upgradability-uups-proxy/projects/corrections/rlp
      - run: forge test --root evm/proxies-and-upgradability-uups-proxy/projects/corrections/solidity
      - run: forge test --root hyperliquid/unpacking-hyperliquid-part-3-hyperevm/projects/precompiles-corewriter
      - run: cargo test --locked --manifest-path hyperliquid/hyperliquid-beyond-generic-vms-the/projects/account-shapes/Cargo.toml
      - run: python3 -m unittest discover -s hyperliquid/hyperliquid-beyond-generic-vms-the/projects/account-shapes/tests -v
      - run: python3 -m unittest discover -s hyperliquid/unpacking-hyperliquid-part-4-hip/projects/hip3-published/tests -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 -m venv hyperliquid/unpacking-hyperliquid-part-5-agent/projects/signing-nonces/.venv
          hyperliquid/unpacking-hyperliquid-part-5-agent/projects/signing-nonces/.venv/bin/python -m pip install -r hyperliquid/unpacking-hyperliquid-part-5-agent/projects/signing-nonces/requirements-verified.txt
          hyperliquid/unpacking-hyperliquid-part-5-agent/projects/signing-nonces/.venv/bin/python -m pip check
          hyperliquid/unpacking-hyperliquid-part-5-agent/projects/signing-nonces/.venv/bin/python -m unittest discover -s hyperliquid/unpacking-hyperliquid-part-5-agent/projects/signing-nonces/tests -v

  evm:
    name: Supplementary EVM labs (not article coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: evm/batching-calls-efficiently-with-multicall/supplementary/go/go.sum
      - run: forge test --root evm/proxies-and-upgradability-minimal/supplementary/foundry
      - run: go test ./...
        working-directory: evm/batching-calls-efficiently-with-multicall/supplementary/go

  solana-and-catalog:
    name: Supplementary Solana labs (not article coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            solana/solana-deep-dive-unpacking-borsh/supplementary/anchor/package-lock.json
            solana/where-token-metadata-lives-on-solana/supplementary/metadata/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/check-catalog.mjs
      - run: cargo test --manifest-path solana/architecting-high-performance-solana/supplementary/fundamentals/Cargo.toml
      - run: cargo check --workspace --manifest-path solana/solana-deep-dive-unpacking-borsh/supplementary/anchor/Cargo.toml
      - run: npm ci
        working-directory: solana/solana-deep-dive-unpacking-borsh/supplementary/anchor
      - run: npx tsc --noEmit
        working-directory: solana/solana-deep-dive-unpacking-borsh/supplementary/anchor
      - run: npm ci
        working-directory: solana/where-token-metadata-lives-on-solana/supplementary/metadata
      - run: npm test
        working-directory: solana/where-token-metadata-lives-on-solana/supplementary/metadata
      - run: npm run check
        working-directory: solana/where-token-metadata-lives-on-solana/supplementary/metadata
      - run: npm ci --ignore-scripts
        working-directory: solana/where-token-metadata-lives-on-solana/projects/metadata-published
      - run: npm run check
        working-directory: solana/where-token-metadata-lives-on-solana/projects/metadata-published
