name: Verify source integrity and examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  restored-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - run: node scripts/setup-restored.mjs
      - run: node scripts/check-catalog.mjs
      - run: node --test scripts/source-integrity.test.mjs
      - run: node scripts/check-evm-alignment.mjs
      - run: node scripts/check-solana-alignment.mjs
      - run: node --test scripts/solana-alignment.test.mjs
      - run: node --test scripts/evm-alignment.test.mjs scripts/toolchain.test.mjs
      - run: node scripts/verify-restored-builds.mjs
      - run: cargo test --locked --manifest-path examples/solana/borsh-proposal/Cargo.toml -p borsh_deep_dive --test allocation
      - run: node scripts/verify-restored-evm.mjs
      - run: go test -count=1 ./...
        working-directory: examples/evm/corrections/rlp
      - run: forge test --root examples/evm/corrections/solidity

  evm:
    name: Supplementary EVM labs (not article coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: evm/go/go.sum
      - run: forge test --root evm/foundry
      - run: go test ./...
        working-directory: evm/go

  solana-and-catalog:
    name: Supplementary Solana labs (not article coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            solana/anchor/package-lock.json
            solana/metadata/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/check-catalog.mjs
      - run: cargo test --manifest-path solana/fundamentals/Cargo.toml
      - run: cargo check --workspace --manifest-path solana/anchor/Cargo.toml
      - run: npm ci
        working-directory: solana/anchor
      - run: npx tsc --noEmit
        working-directory: solana/anchor
      - run: npm ci
        working-directory: solana/metadata
      - run: npm test
        working-directory: solana/metadata
      - run: npm run check
        working-directory: solana/metadata
      - run: npm ci --ignore-scripts
        working-directory: examples/solana/metadata-published
      - run: npm run check
        working-directory: examples/solana/metadata-published
