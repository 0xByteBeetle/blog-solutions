name: Verify examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: evm/go/go.sum
      - run: forge test --root evm/foundry
      - run: go test ./...
        working-directory: evm/go

  solana-and-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            solana/anchor/package-lock.json
            solana/metadata/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/check-catalog.mjs
      - run: cargo test --manifest-path solana/fundamentals/Cargo.toml
      - run: cargo check --workspace --manifest-path solana/anchor/Cargo.toml
      - run: npm ci
        working-directory: solana/anchor
      - run: npx tsc --noEmit
        working-directory: solana/anchor
      - run: npm ci
        working-directory: solana/metadata
      - run: npm test
        working-directory: solana/metadata
      - run: npm run check
        working-directory: solana/metadata
