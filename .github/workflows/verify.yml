name: Verify minimal article companions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-focused-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - run: node scripts/setup-deps.mjs
      - run: bash scripts/verify.sh
      - run: node scripts/verify-evm-integration.mjs
